<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Administración - BusTrack</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
    .admin-tab-btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      background: white;
      border: 1px solid var(--border-color);
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .admin-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .stat-badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius-md);
      padding: 14px;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .stat-card .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-card .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="dashboard.html" class="brand-logo">
      <div class="logo-icon">⚙️</div>
      <span>BusTrack Admin</span>
    </a>
    <div class="d-flex align-center gap-2">
      <span class="text-muted" style="font-size: 0.85rem;" id="admin-name">Admin</span>
      <button class="btn btn-outline-danger btn-sm" onclick="AuthService.logout()">Cerrar Sesión</button>
    </div>
  </header>

  <main class="app-container" style="padding-bottom: 40px;">

    <!-- Métricas del Sistema -->
    <div class="stat-badge-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-total-buses">0</div>
        <div class="stat-label">Autobuses</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-total-companies">0</div>
        <div class="stat-label">Empresas</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-total-routes">0</div>
        <div class="stat-label">Rutas Activas</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-active-incidents" style="color:var(--danger)">0</div>
        <div class="stat-label">Averías Activas</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-total-users">0</div>
        <div class="stat-label">Usuarios</div>
      </div>
    </div>

    <!-- Pestañas de Gestión -->
    <div class="admin-nav-tabs">
      <button class="admin-tab-btn active" data-tab="buses">🚌 Buses</button>
      <button class="admin-tab-btn" data-tab="companies">🏢 Empresas</button>
      <button class="admin-tab-btn" data-tab="routes">🗺️ Rutas</button>
      <button class="admin-tab-btn" data-tab="stops">🚏 Paradas</button>
      <button class="admin-tab-btn" data-tab="incidents">⚠️ Averías</button>
      <button class="admin-tab-btn" data-tab="users">👥 Usuarios</button>
    </div>

    <!-- Área de Contenido Dinámico -->
    <div id="admin-content-area"></div>

    <!-- Acciones de Mantenimiento / Reseteo de Demo -->
    <div class="card p-3 mt-3" style="border: 1px dashed #CBD5E1; background:#F8FAFC;">
      <h4>⚙️ Mantenimiento de Datos del Sistema</h4>
      <p class="text-muted" style="font-size:0.85rem; margin-bottom:12px;">
        Si deseas restablecer los datos de ejemplo iniciales (empresas, buses en David, rutas y paradas), pulsa el siguiente botón:
      </p>
      <button class="btn btn-secondary btn-sm" onclick="resetAllSystemData()">
        🔄 Restaurar Datos de Demostración
      </button>
    </div>

  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initAdminDashboard();
    });
  </script>
</body>
</html>
