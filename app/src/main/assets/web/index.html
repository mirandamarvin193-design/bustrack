<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link</title>
  <!-- Firebase Cloud SDK & Services -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function() {
      const user = AuthService.getCurrentUser();
      if (user) {
        AuthService.redirectByUserRole(user);
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body style="background:#0F172A; display:flex; align-items:center; justify-content:center; height:100vh; color:white; font-family:sans-serif;">
  <div style="text-align:center;">
    <div style="margin-bottom:16px;">
      <img src="img/link_logo.png" alt="Link" style="width:84px; height:84px; border-radius:18px; object-fit:contain;">
    </div>
    <h2 style="font-weight:700; letter-spacing:0.5px;">Cargando Link...</h2>
  </div>
</body>
</html>
